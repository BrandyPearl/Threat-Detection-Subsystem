<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · D.MOBILE</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
const user = mountShell("reports", "Sales Reports", "Daily, weekly and monthly performance");
if (user) render();

function render() {
  const period = (document.getElementById("pr") || {}).value || "Last 7 days";
  const days = period === "Today" ? 1 : period === "Last 7 days" ? 7 : period === "Last 30 days" ? 30 : 3650;
  const now = new Date();
  const sales = DB.data.sales.filter(s => (now - new Date(s.date)) / 86400000 <= days)
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  const rev = sales.reduce((t, s) => t + saleTotal(s), 0);
  const cost = sales.reduce((t, s) => t + saleCost(s), 0);
  const units = sales.reduce((t, s) => t + s.items.reduce((a, i) => a + i.qty, 0), 0);

  const byStaff = {};
  sales.forEach(s => { byStaff[s.staff] = (byStaff[s.staff] || 0) + saleTotal(s); });
  const byPay = {};
  sales.forEach(s => { byPay[s.payment] = (byPay[s.payment] || 0) + saleTotal(s); });
  const maxStaff = Math.max(1, ...Object.values(byStaff));

  document.getElementById("content").innerHTML =
    '<div class="toolbar"><label style="font-size:13px;color:var(--muted)">Period</label>' +
    '<select id="pr">' + ["Today", "Last 7 days", "Last 30 days", "All time"].map(o => '<option' + (o === period ? " selected" : "") + '>' + o + '</option>').join("") + '</select>' +
    '<span class="spacer"></span><button class="btn btn-ghost" onclick="window.print()">Print report</button></div>' +

    '<div class="grid g4">' +
      card("Revenue", money(rev)) + card("Cost of goods", money(cost)) +
      card("Gross profit", money(rev - cost)) + card("Units sold", units, true) +
    '</div>' +

    '<div class="grid g2" style="margin-top:18px">' +
      '<div class="card"><h3>Revenue by staff</h3><div class="card-sub">Staff performance for the selected period</div>' +
        (Object.keys(byStaff).length ? Object.entries(byStaff).sort((a, b) => b[1] - a[1]).map(([n, v]) =>
          '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>' + n + '</span><strong>' + money(v) + '</strong></div>' +
          '<div class="progress"><i style="width:' + (v / maxStaff * 100) + '%"></i></div></div>').join("") : '<div class="empty">No sales in this period.</div>') +
      '</div>' +
      '<div class="card"><h3>Payment methods</h3><div class="card-sub">Where the money came in</div>' +
        '<div class="table-wrap"><table><thead><tr><th>Method</th><th class="right">Amount</th><th class="right">Share</th></tr></thead><tbody>' +
        (Object.keys(byPay).length ? Object.entries(byPay).map(([n, v]) =>
          '<tr><td>' + n + '</td><td class="right">' + money(v) + '</td><td class="right">' + Math.round(v / rev * 100) + '%</td></tr>').join("")
          : '<tr><td colspan="3" class="empty">No data.</td></tr>') +
        '</tbody></table></div></div>' +
    '</div>' +

    '<div class="section-title">Sales &amp; payment history</div>' +
    '<div class="card"><div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Staff</th><th>Items</th><th>Payment</th><th class="right">Revenue</th><th class="right">Profit</th></tr></thead><tbody>' +
    (sales.length ? sales.map(s =>
      '<tr><td><span class="pill blue">' + s.id + '</span></td><td>' + dtt(s.date) + '</td><td>' + s.staff + '</td>' +
      '<td>' + s.items.map(i => i.qty + "× " + i.name).join("<br>") + '</td><td>' + s.payment + '</td>' +
      '<td class="right">' + money(saleTotal(s)) + '</td><td class="right" style="color:var(--ok);font-weight:700">' + money(saleTotal(s) - saleCost(s)) + '</td></tr>').join("")
      : '<tr><td colspan="7" class="empty">No sales in this period.</td></tr>') +
    '</tbody></table></div></div>';

  document.getElementById("pr").onchange = render;
}
function card(l, v, red) { return '<div class="card stat' + (red ? " red" : "") + '"><div class="label">' + l + '</div><div class="value" style="font-size:23px">' + v + '</div></div>'; }
</script>
</body>
</html>
