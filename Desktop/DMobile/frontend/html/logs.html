<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity logs · D.MOBILE</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
const user = mountShell("logs", "Activity Logs", "Who did what, and when");
if (user) render();

function render() {
  const q = (document.getElementById("q") || {}).value || "";
  const logs = DB.data.logs.filter(l => (l.user + l.action).toLowerCase().includes(q.toLowerCase()));
  document.getElementById("content").innerHTML =
    '<div class="toolbar"><input id="q" placeholder="Search logs…" style="min-width:300px" value="' + q + '">' +
    '<span class="spacer"></span><button class="btn btn-red" id="rs">Reset demo data</button></div>' +
    '<div class="card"><div class="table-wrap"><table><thead><tr><th>When</th><th>User</th><th>Action</th></tr></thead><tbody>' +
    (logs.length ? logs.map(l => '<tr><td style="white-space:nowrap">' + dtt(l.date) + '</td><td><strong>' + l.user + '</strong></td><td>' + l.action + '</td></tr>').join("")
      : '<tr><td colspan="3" class="empty">No log entries.</td></tr>') +
    '</tbody></table></div></div>';
  document.getElementById("q").oninput = render;
  document.getElementById("rs").onclick = function () {
    if (confirm("Reset all demo data back to the original sample set?")) { DB.reset(); render(); toast("Demo data reset"); }
  };
}
</script>
</body>
</html>
