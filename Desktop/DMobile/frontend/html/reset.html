<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password reset · D.MOBILE</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <section class="auth-brand">
    <img src="../img/logo.jpg" alt="D.MOBILE logo">
    <h1>Password reset</h1>
    <p>A reset link will be sent to the email registered by the Super Admin.</p>
    <span class="tagline">EXPERIENCE THE BEST</span>
  </section>
  <section class="auth-panel">
    <div class="auth-card">
      <h2>Reset your password</h2>
      <p class="sub">Enter your work email and we'll send reset instructions.</p>
      <form id="rf">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@dmobile.cm" required>
        </div>
        <button class="btn btn-block" type="submit">Send reset link</button>
      </form>
      <div id="done" class="alert warn" style="display:none;margin-top:16px">Demo only — no email is actually sent.</div>
      <p style="margin-top:16px;font-size:13px;text-align:center"><a href="index.html" style="color:var(--blue);font-weight:600">Back to login</a></p>
    </div>
  </section>
</div>
<script>
document.getElementById("rf").addEventListener("submit", function (e) {
  e.preventDefault();
  document.getElementById("done").style.display = "flex";
});
</script>
</body>
</html>
